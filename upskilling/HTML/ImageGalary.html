<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Gallery</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        .event-img {
            width: 200px;
            height: 150px;
            border: 3px solid #003366;
            border-radius: 6px;
            object-fit: cover;
        }
        caption {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #003366;
        }
        td {
            padding: 10px;
            font-size: 0.9em;
            color: #444;
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">Community Event Gallery</h1>

    <table>
        <caption>Past Community Events – 2024</caption>
        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Music+Fest"
                     alt="Music Festival" title="Annual Music Festival" class="event-img">
                <br>Annual Music Festival
            </td>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Food+Fair"
                     alt="Food Fair" title="Community Food Fair" class="event-img">
                <br>Community Food Fair
            </td>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Art+Show"
                     alt="Art Show" title="Local Art Show" class="event-img">
                <br>Local Art Show
            </td>
        </tr>
        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Marathon"
                     alt="Marathon" title="City Marathon" class="event-img">
                <br>City Marathon
            </td>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Tech+Talk"
                     alt="Tech Talk" title="Tech Talk 2024" class="event-img">
                <br>Tech Talk 2024
            </td>
            <td>
                <img src="https://via.placeholder.com/200x150?text=Book+Fair"
                     alt="Book Fair" title="Annual Book Fair" class="event-img">
                <br>Annual Book Fair
            </td>
        </tr>
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>
    <style>
        #welcomeBanner {
            background-color: #003399;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin: 20px;
        }
        .highlight {
            background-color: yellow;
            color: black;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="welcomeBanner">
        <h1>Welcome, <span style="color: red; font-weight: bold;">John!</span></h1>
        <p>You have a <span class="highlight">Special Offer</span> waiting for you!</p>
        <p>Register for any event today and get <span style="color: #ffdd00; font-weight: bold;">10% OFF</span>.</p>
    </div>

    <div>
        <p>This is a <span class="highlight">highlighted</span> section for important notices.</p>
        <p>Don't miss our <span class="highlight">featured events</span> this weekend.</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Community Event Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #003366; color: white; padding: 20px; text-align: center; }
        nav { background: #005599; padding: 10px; }
        nav a { color: white; margin: 0 15px; text-decoration: none; }
        footer { background: #003366; color: white; text-align: center; padding: 10px; margin-top: 40px; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <header>
        <h1>Local Community Event Portal</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main -->
    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>Find and register for community events near you.</p>
        </section>

        <section id="events">
            <h2>Events</h2>
            <p>Upcoming events will be listed here.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Reach out to us at info@communityportal.com</p>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Local Community Event Portal</p>
    </footer>

</body>
</html>
